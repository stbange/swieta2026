<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ŚWIĘTA 2026 — The Grand Hall of 24 Portals</title>
  <style>
    :root {
      --bg: #0c0a14;
      --panel: rgba(18, 16, 30, 0.92);
      --gold: #ffd452;
      --neon: #ff3bb8;
      --cyan: #2ae8ff;
      --text: #f2f4ff;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }
    #stage {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #090810;
    }
    #canvas {
      width: 100vw; height: 100dvh; display: block;
      image-rendering: pixelated; image-rendering: crisp-edges;
      touch-action: none;
    }
    #menuToggle {
      position: fixed; top: 8px; right: 8px; z-index: 25;
      background: var(--panel); color: var(--gold);
      border: 1px solid rgba(255, 212, 82, 0.55);
      border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: bold;
      display: none;
    }
    #topbar {
      position: fixed; top: 8px; right: 8px; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      background: var(--panel); border: 1px solid rgba(255, 212, 82, 0.35);
      border-radius: 6px; padding: 6px 8px; font-size: 12px;
      max-width: calc(100vw - 16px);
    }
    @media (max-width: 720px) {
      #menuToggle { display: inline-block; }
      #topbar { top: 42px; display: none; }
      #topbar.open { display: flex; }
      #statusBar { display: none; }
    }
    button, select, input {
      background: #1d1933; color: var(--text);
      border: 1px solid rgba(42, 232, 255, 0.45);
      border-radius: 4px; padding: 4px 8px;
      font-family: inherit; font-size: 12px; cursor: pointer;
    }
    button:hover { border-color: var(--gold); color: var(--gold); }
    button.accent { border-color: var(--neon); color: var(--neon); }
    #mpModal {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center;
      background: rgba(6, 5, 12, 0.78);
    }
    #mpCard {
      width: min(520px, 92vw); background: #141126;
      border: 2px solid var(--gold); border-radius: 8px; padding: 16px;
      display: flex; flex-direction: column; gap: 10px; font-size: 13px;
    }
    #mpCard textarea {
      width: 100%; height: 74px; background: #0b0916; color: var(--cyan);
      border: 1px solid #35305c; border-radius: 4px; padding: 6px;
      font-family: inherit; font-size: 11px; user-select: text; -webkit-user-select: text;
    }
    #statusBar {
      position: fixed; bottom: 4px; left: 8px; z-index: 20;
      background: rgba(12, 10, 20, 0.72); padding: 3px 8px;
      border-radius: 4px; font-size: 11px; color: #b7c2e6;
      pointer-events: none;
    }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { color: var(--gold); font-weight: bold; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  </div>

  <button id="menuToggle">☰ MENU</button>

  <div id="topbar">
    <span class="badge">SWIETA 2026</span>
    <select id="selRealm" title="Jump to Grand Hall or Act I Portals (Days 1-6)">
      <option value="0">Grand Hall</option>
      <option value="1">Day 1: Duke '96</option>
      <option value="2">Day 2: Tomb Raider</option>
      <option value="3">Day 3: de_yule_dust</option>
      <option value="4">Day 4: Quake</option>
      <option value="5">Day 5: Blood</option>
      <option value="6">Day 6: Doom Climax</option>
    </select>
    <select id="selSplit" title="Local Split-Screen Players (F3)">
      <option value="1">1P Solo</option>
      <option value="2">2P Split</option>
      <option value="4">4P Split</option>
    </select>
    <select id="selRes" title="Retro Internal Resolution (F2)">
      <option value="400x240">400×240</option>
      <option value="320x240">320×240</option>
      <option value="480x270">480×270</option>
    </select>
    <button id="btnUnlock" title="Toggle Playtest Unlock-All (F1)">Unlock: ON</button>
    <button id="btnTouch" title="Toggle Mobile Touch Controls (F4)">Touch</button>
    <button id="btnMP" title="Online WebRTC Multiplayer">Online MP</button>
    <button id="btnXR" title="Enter Stereoscopic WebXR VR">Enter VR</button>
    <button id="btnHelp" title="Controls">?</button>
  </div>

  <div id="mpModal">
    <div id="mpCard">
      <div class="row" style="justify-content:space-between;">
        <span class="badge">ONLINE MULTIPLAYER (WebRTC P2P)</span>
        <button id="btnMpClose">Close</button>
      </div>
      <div class="row">
        <label>Signaling Relay:</label>
        <input id="inpRelay" style="flex:1;" value="" placeholder="wss://your-relay.workers.dev (optional)" />
      </div>
      <div class="row">
        <button id="btnHost" class="accent">Host Room</button>
        <input id="inpRoom" style="width:100px;text-transform:uppercase;" placeholder="ROOM6" maxlength="6" />
        <button id="btnJoin">Join Room</button>
      </div>
      <div id="mpStatus" style="color:var(--cyan);">Status: Offline (Relay or zero-server manual invite ready)</div>
      <div style="font-size:11px;color:#b8c0dd;">Zero-Server Copy/Paste SDP Fallback (works 100% static on GitHub Pages):</div>
      <div class="row">
        <button id="btnManualOffer">1. Create Offer</button>
        <button id="btnManualAcceptOffer">2. Accept Offer → Answer</button>
        <button id="btnManualApplyAnswer">3. Apply Answer</button>
      </div>
      <textarea id="txtSdpOut" readonly placeholder="Your invite token appears here — send to friend..."></textarea>
      <textarea id="txtSdpIn" placeholder="Paste friend's Offer or Answer token here..."></textarea>
    </div>
  </div>

  <div id="statusBar">
    Loading WASM... | Click canvas to aim | WASD Move · Space Jump/Swim/Mantle · LMB Fire · RMB Alt-Fire · 1-5 Weap · E Use
  </div>

  <script src="webrtc_bridge.js"></script>
  <script src="webxr_bridge.js"></script>
  <script>
    const statusEl = document.getElementById("statusBar");
    const canvas = document.getElementById("canvas");
    const topbar = document.getElementById("topbar");
    let unlockAll = true;
    let touchOn = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0) ||
                  (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);

    const params = new URLSearchParams(window.location.search);
    if (params.get("unlock") === "strict") unlockAll = false;
    if (params.get("unlock") === "all") unlockAll = true;
    const startDay = parseInt(params.get("day") || "0", 10);
    const wasmArgs = [unlockAll ? "--unlock-all" : "--strict-calendar"];
    if (startDay >= 1 && startDay <= 24) wasmArgs.push("--day=" + startDay);

    function syncViewportSize() {
      const w = Math.max(1, Math.floor(window.innerWidth));
      const h = Math.max(1, Math.floor(window.innerHeight));
      if (window.Module && Module._swieta_resize) {
        Module._swieta_resize(w, h);
      }
    }
    window.addEventListener("resize", syncViewportSize);
    window.addEventListener("orientationchange", () => setTimeout(syncViewportSize, 150));

    window.Module = {
      canvas: canvas,
      arguments: wasmArgs,
      print: (txt) => console.log("[SWIETA]", txt),
      printErr: (txt) => console.warn("[SWIETA]", txt),
      onRuntimeInitialized: () => {
        statusEl.textContent = "Click canvas to aim | WASD Move · Space Jump/Swim/Mantle · LMB Fire · RMB Alt-Fire · 1-5 Weap · E Use";
        if (startDay >= 1 && startDay <= 6) document.getElementById("selRealm").value = String(startDay);
        setTimeout(() => {
          syncViewportSize();
          if (Module._swieta_set_unlock_all) Module._swieta_set_unlock_all(unlockAll ? 1 : 0);
          if (touchOn && Module._swieta_toggle_touch) Module._swieta_toggle_touch(1);
        }, 80);
        document.getElementById("btnUnlock").textContent = unlockAll ? "Unlock: ON" : "Unlock: STRICT";
        if (window.SwietaXR) window.SwietaXR.init(canvas, Module);
        if (window.SwietaNet) window.SwietaNet.init(Module);
      }
    };

    document.getElementById("menuToggle").onclick = () => topbar.classList.toggle("open");
    document.getElementById("selRealm").onchange = (e) => {
      const d = parseInt(e.target.value, 10);
      if (Module._swieta_jump_to_day) Module._swieta_jump_to_day(d);
      topbar.classList.remove("open");
    };
    document.getElementById("selSplit").onchange = (e) => {
      if (Module._swieta_set_split_screen) Module._swieta_set_split_screen(parseInt(e.target.value, 10));
    };
    document.getElementById("selRes").onchange = (e) => {
      const [w, h] = e.target.value.split("x").map(Number);
      if (Module._swieta_set_retro_res) Module._swieta_set_retro_res(w, h);
    };
    document.getElementById("btnUnlock").onclick = () => {
      unlockAll = !unlockAll;
      if (Module._swieta_set_unlock_all) Module._swieta_set_unlock_all(unlockAll ? 1 : 0);
      document.getElementById("btnUnlock").textContent = unlockAll ? "Unlock: ON" : "Unlock: STRICT";
    };
    document.getElementById("btnTouch").onclick = () => {
      touchOn = !touchOn;
      if (Module._swieta_toggle_touch) Module._swieta_toggle_touch(touchOn ? 1 : 0);
      topbar.classList.remove("open");
    };
    document.getElementById("btnMP").onclick = () => {
      document.getElementById("mpModal").style.display = "flex";
      topbar.classList.remove("open");
    };
    document.getElementById("btnMpClose").onclick = () => { document.getElementById("mpModal").style.display = "none"; };
    document.getElementById("btnXR").onclick = () => window.SwietaXR && window.SwietaXR.toggleSession();
    document.getElementById("btnHelp").onclick = () => {
      alert("SWIETA 2026 — ACT I (DAYS 1-6) CONTROLS:\n\nWASD: Move · Mouse/Drag: Look · 1-5 / Tab / WEAP: Level Weapons\nLMB / FIRE: Primary Fire · RMB / DET: Alt-Fire (Pipebomb Det / Tomb Dodge / CS Sniper Scope & Smoke / Blood Starburst, Molotov, Prox TNT & Voodoo Curse)\nSpace / JUMP: Jump, Swim Up, Ledge Mantle, or Day 1 Jetpack\nE / USE: Push Blocks, Flip Switches, CS Buy Crate ($), Defuse C4, Open Doors\nH: Return to Grand Festive Hall");
    };
  </script>
  <script async src="swieta2026.js"></script>
</body>
</html>
